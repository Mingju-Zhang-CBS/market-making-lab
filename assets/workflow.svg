<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img"><title>Market Making Lab workflow</title><rect width="1000" height="515" rx="14" fill="#F5F7FA"/><rect x="32" y="28" width="936" height="68" rx="12" fill="#101928"/><text x="60" y="73" fill="#F5F7FA" font-family="Arial,sans-serif" font-size="32">01  Compute conditional fair value</text><path d="M500 98 v20" stroke="#36B3A8" stroke-width="4"/><rect x="32" y="122" width="936" height="68" rx="12" fill="#17343c"/><text x="60" y="167" fill="#F5F7FA" font-family="Arial,sans-serif" font-size="32">02  Quote using current information</text><path d="M500 192 v20" stroke="#36B3A8" stroke-width="4"/><rect x="32" y="216" width="936" height="68" rx="12" fill="#101928"/><text x="60" y="261" fill="#F5F7FA" font-family="Arial,sans-serif" font-size="32">03  Apply shared external order flow</text><path d="M500 286 v20" stroke="#36B3A8" stroke-width="4"/><rect x="32" y="310" width="936" height="68" rx="12" fill="#17343c"/><text x="60" y="355" fill="#F5F7FA" font-family="Arial,sans-serif" font-size="32">04  Check inventory and collateral</text><path d="M500 380 v20" stroke="#36B3A8" stroke-width="4"/><rect x="32" y="404" width="936" height="68" rx="12" fill="#101928"/><text x="60" y="449" fill="#F5F7FA" font-family="Arial,sans-serif" font-size="32">05  Mark, attribute and settle</text></svg>
